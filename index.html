<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#05060a" />
  <meta name="description" content="Julián's Shader Gallery — Lote 1: 10 cyberpunk WebGL backgrounds" />
  <title>Shader Gallery · Lote 1</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305060a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="fallback" class="fallback" hidden>
    <div class="fallback-card">
      <h1>WebGL unavailable</h1>
      <p>This gallery needs WebGL to run the shaders. Try another browser (Safari 15+, Chrome, Firefox) or enable WebGL in settings.</p>
    </div>
  </div>

  <canvas id="gl" aria-label="Shader canvas"></canvas>

  <div class="chrome" id="chrome">
    <header class="top-bar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-text">SHADER GALLERY</span>
        <span class="brand-lote">LOTE 1</span>
      </div>
      <div class="counter" id="counter">01 / 10</div>
    </header>

    <button class="nav nav-prev" id="prev" type="button" aria-label="Previous shader">‹</button>
    <button class="nav nav-next" id="next" type="button" aria-label="Next shader">›</button>

    <footer class="bottom-bar">
      <div class="shader-meta">
        <div class="name-row">
          <h1 class="shader-name" id="shaderName">Neon Rain</h1>
          <div class="rate" role="group" aria-label="Rate shader">
            <button class="rate-btn rate-like" id="likeBtn" type="button" aria-label="Like" aria-pressed="false">❤️</button>
            <button class="rate-btn rate-dislike" id="dislikeBtn" type="button" aria-label="Dislike" aria-pressed="false">👎</button>
          </div>
        </div>
        <p class="shader-mood" id="shaderMood">acid cyan · falling neon · night noir</p>
      </div>
      <div class="actions">
        <div class="dots" id="dots" role="tablist" aria-label="Shader index"></div>
        <div class="action-btns">
          <button class="btn-export btn-votes" id="votesBtn" type="button">VOTES</button>
          <button class="btn-export" id="exportBtn" type="button">EXPORT</button>
        </div>
      </div>
    </footer>
  </div>

  <div class="export-panel" id="exportPanel" hidden>
    <div class="export-sheet">
      <div class="export-head">
        <h2>Export Spec</h2>
        <button class="btn-close" id="closeExport" type="button" aria-label="Close">×</button>
      </div>
      <pre class="export-body" id="exportBody"></pre>
      <div class="export-foot">
        <button class="btn-copy" id="copyExport" type="button">Copy to clipboard</button>
        <span class="copy-status" id="copyStatus" aria-live="polite"></span>
      </div>
    </div>
  </div>

  <script src="shaders.js"></script>
  <script src="app.js"></script>
</body>
</html>
